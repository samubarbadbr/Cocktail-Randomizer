    // =========================================================================
    // 🔊 AUDIO ENGINE (Web Audio API nativo per feedback sonoro)
    // =========================================================================
    class SoundFx {
      constructor() { this.ctx = null; this.enabled = true; }
      init() {
        try {
          if (!this.ctx && typeof window !== 'undefined') {
            const C = window.AudioContext || window.webkitAudioContext;
            if (C) this.ctx = new C();
          }
          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        } catch (e) {}
      }
      tick() {
        if (!this.enabled) return;
        try {
          this.init(); if (!this.ctx) return;
          const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320 + Math.random() * 200, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.03);
          g.gain.setValueAtTime(0.06, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
          osc.connect(g); g.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.03);
        } catch (e) {}
      }
      chime() {
        if (!this.enabled) return;
        try {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.05);
            g.gain.setValueAtTime(0, now + i * 0.05);
            g.gain.linearRampToValueAtTime(0.12, now + i * 0.05 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.35);
            osc.connect(g); g.connect(this.ctx.destination);
            osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.35);
          });
        } catch (e) {}
      }
    }
    const sound = new SoundFx();

    const triggerHaptic = (ms = 20) => {
      try { if (typeof navigator !== 'undefined' && 'vibrate' in navigator) navigator.vibrate(ms); } catch (e) {}

            {screen === 'advisor' && (
              <div className="w-full glass-card rounded-3xl p-4 sm:p-5 border border-white/10 shadow-2xl space-y-3">
                <div className="flex items-center justify-between pb-1 border-b border-white/5">
                  <button
                    onClick={() => setScreen('cover')}
                    className="flex items-center gap-1 text-slate-300 hover:text-amber-300 text-xs font-semibold px-2.5 py-1 rounded-xl bg-white/5 border border-white/5 active:scale-95 transition"
                  >
                    ← Copertina
                  </button>
                  <span className="text-[10px] font-bold uppercase tracking-widest text-amber-400 bg-amber-500/10 px-2.5 py-0.5 rounded-full border border-amber-500/20">
                    Filtri Advisor
                  </span>
                </div>

                <div className="relative">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Cerca ingrediente (es. Gin, Kahlúa, Menta...)"
                    className="w-full px-3.5 py-2 pl-9 rounded-xl bg-black/40 border border-white/10 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition"
                  />
                  <span className="absolute left-3 top-2 text-xs text-slate-400">🔍</span>
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute right-3 top-2 text-xs text-slate-400 hover:text-white">✕</button>
                  )}
                </div>

                {/* 1. Spirito Base */}
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-[10px] uppercase font-bold tracking-wider text-amber-400 font-syne">1. Spirito o Base</label>
                    {selectedSpirit !== 'Tutti' && (
                      <button onClick={() => setSelectedSpirit('Tutti')} className="text-[10px] text-slate-400 hover:text-white">Azzera</button>
                    )}
                  </div>
                  <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1 text-xs">
                    {spiritList.map(s => (
                      <button
                        key={s}
                        onClick={() => setSelectedSpirit(s)}
                        className={`px-3 py-1.5 rounded-full whitespace-nowrap text-xs font-semibold transition active:scale-95 ${selectedSpirit === s ? 'bg-amber-500 text-black font-bold shadow-md shadow-amber-500/20' : 'bg-white/5 text-slate-300 border border-white/5 hover:bg-white/10'}`}
                      >
                        {s}
                      </button>
                    ))}
                  </div>
                </div>

                {/* 2. Profilo Gusto */}
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-[10px] uppercase font-bold tracking-wider text-amber-400 font-syne">2. Gusto / Sapore</label>
                    {selectedFlavor !== 'Tutti' && (
                      <button onClick={() => setSelectedFlavor('Tutti')} className="text-[10px] text-slate-400 hover:text-white">Azzera</button>
                    )}
                  </div>
                  <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1 text-xs">
                    {flavorList.map(f => (
                      <button
                        key={f}
                        onClick={() => setSelectedFlavor(f)}
                        className={`px-3 py-1.5 rounded-full whitespace-nowrap text-xs font-semibold transition active:scale-95 ${selectedFlavor === f ? 'bg-amber-500 text-black font-bold shadow-md shadow-amber-500/20' : 'bg-white/5 text-slate-300 border border-white/5 hover:bg-white/10'}`}
                      >
                        {f}
                      </button>
                    ))}
                  </div>
                </div>

                {/* 3. Gradazione */}
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-[10px] uppercase font-bold tracking-wider text-amber-400 font-syne">3. Gradazione / Momento</label>
                    {selectedStrength !== 'Tutti' && (
                      <button onClick={() => setSelectedStrength('Tutti')} className="text-[10px] text-slate-400 hover:text-white">Azzera</button>
                    )}
                  </div>
                  <div className="grid grid-cols-5 gap-1 text-[11px]">
                    {strengthList.map(st => (
                      <button
                        key={st}
                        onClick={() => setSelectedStrength(st)}
                        className={`py-1.5 rounded-lg text-center font-semibold transition active:scale-95 ${selectedStrength === st ? 'bg-amber-500 text-black font-bold' : 'bg-white/5 text-slate-300 border border-white/5'}`}
                      >
                        {st}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Counter & Action */}
                <div className="pt-2 border-t border-white/5 flex items-center justify-between">
                  <span className="text-xs text-slate-400">Trovati: <b className="text-amber-400">{filteredCocktails.length}</b></span>
                  <button
                    onClick={() => handleRandomize(filteredCocktails)}
                    disabled={filteredCocktails.length === 0}
                    className="py-2.5 px-4 rounded-xl font-bold font-syne text-xs uppercase tracking-wider bg-gradient-to-r from-amber-500 to-amber-400 text-black border border-amber-200 gold-glow active:scale-95 shadow-lg disabled:opacity-40"
                  >
                    🎲 ESTRAI DA QUESTI ({filteredCocktails.length})
                  </button>
                </div>
              </div>
            )}

            {/* 3. CATALOGO COMPLETO (CATALOG VIEW) */}
            {screen === 'catalog' && (
              <div className="w-full glass-card rounded-3xl p-4 border border-white/10 shadow-2xl space-y-3 max-h-[75vh] flex flex-col">
                <div className="flex items-center justify-between pb-2 border-b border-white/5">
                  <h3 className="font-syne font-bold text-sm text-white flex items-center gap-1.5">
                    <span>📖</span> Catalogo ({COCKTAILS_DATABASE.length})
                  </h3>
                  <button onClick={() => setScreen('advisor')} className="text-xs text-amber-400 font-bold hover:underline">
                    Filtra
                  </button>
                </div>

                <div className="overflow-y-auto no-scrollbar space-y-2 pr-1">
                  {COCKTAILS_DATABASE.map(item => (
                    <div
                      key={item.id}
                      onClick={() => openCocktail(item)}
                      className="p-3 rounded-2xl bg-black/30 hover:bg-amber-500/10 border border-white/5 hover:border-amber-500/30 flex items-center justify-between cursor-pointer transition active:scale-98"
                    >
                      <div className="flex items-center gap-3">
                        <div 
                          className="w-10 h-10 rounded-xl flex items-center justify-center font-bold text-black text-sm"
                          style={{ background: item.color || '#f59e0b' }}
                        >
                          🍸
                        </div>
                        <div>
                          <div className="font-bold text-white text-xs sm:text-sm font-syne flex items-center gap-1.5">
                            {item.name}
                            {item.badge && (
                              <span className="text-[9px] px-1.5 py-0.2 rounded bg-white/10 text-amber-300 font-sans">
                                {item.badge}
                              </span>
                            )}
                          </div>
                          <div className="text-[10px] text-slate-400">
                            {item.baseSpirit} • {item.flavors.slice(0, 2).join(', ')} • {item.strength}
                          </div>
                        </div>
                      </div>
                      <span className="text-amber-400 text-xs font-bold">➔</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 4. SHUFFLE MIXING ANIMATION */}
            {screen === 'detail' && isShuffling && (
              <div className="w-full glass-card p-8 rounded-3xl text-center border border-amber-500/40 gold-glow flex flex-col items-center justify-center min-h-[280px]">
                <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center text-3xl mb-4 text-black animate-shaker shadow-lg shadow-amber-500/30">
                  🧊
                </div>
                <span className="text-[10px] font-bold uppercase tracking-widest text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20 mb-2">
                  Mixology Shaker
                </span>
                <h2 className="text-2xl font-extrabold font-syne text-white tracking-tight mb-1">
                  {shufflingName || 'Mixing...'}
                </h2>
                <p className="text-xs text-slate-400">Ricerca dell'equilibrio aromatico perfetto...</p>
              </div>
            )}

            {/* 5. SCHEDA DETTAGLIO COCKTAIL (DETAIL VIEW) */}
            {screen === 'detail' && !isShuffling && currentCocktail && (
              <div className="w-full glass-card rounded-3xl p-4 sm:p-5 border border-amber-500/20 shadow-2xl relative space-y-3">
                
                {/* Header Scheda: Categoria & Azioni */}
                <div className="flex items-center justify-between pb-1">
                  <span className="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
                    {currentCocktail.category}
                  </span>
                  
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={() => toggleFav(currentCocktail)}
                      className={`p-2 rounded-full border transition active:scale-90 ${isFav ? 'bg-rose-500/20 border-rose-500 text-rose-400' : 'bg-white/5 border-white/10 text-slate-300'}`}
                      title="Salva nei Preferiti"
                    >
                      {isFav ? '❤️' : '🤍'}
                    </button>

                    <button
                      onClick={() => handleShare(currentCocktail)}
                      className="p-2 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 active:scale-90 transition"
                      title="Condividi Ricetta"
                    >
                      {copied ? '✓' : '🔗'}
                    </button>
                  </div>
                </div>

                {/* Titolo e Descrizione */}
                <div className="text-center">
                  <h2 className="text-2xl sm:text-3xl font-extrabold font-syne tracking-tight text-white mb-0.5">
                    {currentCocktail.name}
                  </h2>
                  <p className="text-xs text-slate-300 leading-relaxed italic">
                    "{currentCocktail.description}"
                  </p>
                </div>

                {/* Tag Gusto & Dettagli Chiave */}
                <div className="flex flex-wrap justify-center gap-1.5">
                  <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/20">
                    🥃 Base: {currentCocktail.baseSpirit}
                  </span>
                  <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/20">
                    ⚡ {currentCocktail.strength}
                  </span>
                  {currentCocktail.flavors.map((f, i) => (
                    <span key={i} className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-white/5 text-slate-300 border border-white/5">
                      #{f}
                    </span>
                  ))}
                </div>

                {/* Selettore Dosi / Bicchieri */}
                <div className="flex items-center justify-between bg-black/30 px-3 py-1.5 rounded-xl border border-white/5 text-xs">
                  <span className="text-[11px] text-slate-400 font-medium">Numero di Bicchieri:</span>
                  <div className="flex items-center gap-1.5">
                    {[1, 2, 4].map(num => (
                      <button
                        key={num}
                        onClick={() => setServings(num)}
                        className={`px-2.5 py-0.5 rounded-lg font-bold text-xs transition active:scale-95 ${servings === num ? 'bg-amber-500 text-black shadow-md' : 'bg-white/5 text-slate-400 hover:text-white'}`}
                      >
                        {num}x
                      </button>
                    ))}
                  </div>
                </div>

                {/* Tabs di navigazione della Scheda */}
                <div className="grid grid-cols-3 gap-1 bg-black/40 p-1 rounded-xl border border-white/10 text-xs">
                  {[
                    { id: 'recipe', label: '📋 Ricetta' },
                    { id: 'tips', label: '⭐ Barman' },
                    { id: 'story', label: '📖 Storia' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`py-1.5 rounded-lg font-semibold transition text-center ${activeTab === tab.id ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'text-slate-400 hover:text-white'}`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                {/* TAB 1: RICETTA & INGREDIENTI */}
                {activeTab === 'recipe' && (
                  <div className="space-y-2.5">
                    <div className="bg-black/30 rounded-2xl p-3 border border-white/5">
                      <div className="text-[10px] font-bold uppercase tracking-wider text-amber-400 font-syne mb-1.5 flex justify-between">
                        <span>Ingredienti ({servings} {servings === 1 ? 'bicchiere' : 'bicchieri'})</span>
                        <span className="text-[9px] text-slate-400 font-sans">Dosi precise</span>
                      </div>
                      <div className="space-y-1.5">
                        {currentCocktail.ingredients.map((ing, idx) => (
                          <div key={idx} className="flex items-center justify-between text-xs py-1 border-b border-white/5 last:border-0">
                            <span className="text-slate-200 font-medium">• {ing.name}</span>
                            <span className="font-bold text-amber-300 bg-amber-500/10 px-2 py-0.5 rounded-md">
                              {ing.amount * servings} {ing.unit}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-black/30 rounded-2xl p-3 border border-white/5">
                      <div className="text-[10px] font-bold uppercase tracking-wider text-amber-400 font-syne mb-1.5">
                        Preparazione Passo-Passo
                      </div>
                      <div className="space-y-1.5">
                        {currentCocktail.recipe.map((step, idx) => (
                          <div key={idx} className="flex items-start gap-2 text-xs text-slate-300">
                            <span className="w-4 h-4 rounded-full bg-amber-500/20 text-amber-400 font-bold text-[10px] flex items-center justify-center shrink-0 mt-0.5">
                              {idx + 1}
                            </span>
                            <span className="leading-relaxed">{step}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* TAB 2: CONSIGLI DEL BARMAN */}
                {activeTab === 'tips' && (
                  <div className="space-y-2 text-xs">
                    <div className="bg-black/30 rounded-2xl p-3 border border-white/5">
                      <div className="text-amber-400 font-bold mb-1 flex items-center gap-1.5">
                        <span>🍸</span> Bicchiere di Servizio
                      </div>
                      <p className="text-slate-200">{currentCocktail.glass}</p>
                    </div>

                    <div className="bg-gradient-to-r from-amber-500/15 to-transparent rounded-2xl p-3 border border-amber-500/30">
                      <div className="text-amber-400 font-bold font-syne mb-1 flex items-center gap-1.5">
                        <span>⭐</span> Il Segreto del Bartender
                      </div>
                      <p className="text-slate-200 leading-relaxed">{currentCocktail.tips}</p>
                    </div>
                  </div>
                )}

                {/* TAB 3: STORIA & ORIGINE */}
                {activeTab === 'story' && (
                  <div className="bg-black/30 rounded-2xl p-3.5 border border-white/5 text-xs">
                    <div className="text-amber-400 font-bold font-syne mb-1.5 flex items-center gap-1.5">
                      <span>📖</span> Storia & Aneddoti del Drink
                    </div>
                    <p className="text-slate-300 leading-relaxed italic">{currentCocktail.story}</p>
                  </div>
                )}

              </div>
            )}

          </main>

          {/* ================================================================= */}
          {/* 🔘 FOOTER BUTTONS                                                 */}
          {/* ================================================================= */}
          <footer className="pt-3 space-y-2">
            {screen === 'detail' && !isShuffling && (
              <div className="grid grid-cols-2 gap-2">
                <button
                  onClick={() => handleRandomize(filteredCocktails)}
                  className="py-3 px-3 rounded-2xl font-bold font-syne text-xs uppercase tracking-wider bg-white/10 hover:bg-white/15 text-white border border-white/10 active:scale-95 transition flex items-center justify-center gap-1.5"
                >
                  <span>🔄</span>
                  <span>Altro con questi filtri</span>
                </button>

                <button
                  onClick={() => handleRandomize(COCKTAILS_DATABASE)}
                  className="py-3 px-3 rounded-2xl font-bold font-syne text-xs uppercase tracking-wider bg-gradient-to-r from-amber-500 to-amber-600 text-black border border-amber-300 gold-glow active:scale-95 transition flex items-center justify-center gap-1.5 shadow-xl"
                >
                  <span>🎲</span>
                  <span>A Sorpresa</span>
                </button>
              </div>
            )}

            {screen === 'advisor' && (
              <div className="grid grid-cols-2 gap-2">
                <button
                  onClick={() => handleRandomize(COCKTAILS_DATABASE)}
                  className="py-3 px-3 rounded-2xl font-bold font-syne text-xs uppercase tracking-wider bg-white/10 text-white border border-white/10 active:scale-95 flex items-center justify-center gap-1.5"
                >
                  <span>🎲</span>
                  <span>A Sorpresa</span>
                </button>

                <button
                  onClick={() => setScreen('catalog')}
                  className="py-3 px-3 rounded-2xl font-bold font-syne text-xs uppercase tracking-wider bg-white/10 text-white border border-white/10 active:scale-95 flex items-center justify-center gap-1.5"
                >
                  <span>📖</span>
                  <span>Tutto il Catalogo</span>
                </button>
              </div>
            )}
          </footer>

          {/* ================================================================= */}
          {/* 💖 MODALE PREFERITI                                               */}
          {/* ================================================================= */}
          {isFavsOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#12121c] border border-white/10 rounded-3xl p-5 shadow-2xl max-h-[80vh] flex flex-col">
                <div className="flex justify-between items-center pb-3 border-b border-white/10">
                  <h3 className="font-syne font-bold text-base text-white flex items-center gap-2">
                    <span>❤️</span> I Tuoi Preferiti ({favorites.length})
                  </h3>
                  <button onClick={() => setIsFavsOpen(false)} className="text-slate-400 hover:text-white text-base">✕</button>
                </div>
                <div className="overflow-y-auto no-scrollbar py-3 space-y-2 flex-1">
                  {favorites.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-8">Nessun cocktail salvato. Tocca il cuore ❤️ su una scheda per salvarlo qui.</p>
                  ) : (
                    favorites.map(f => (
                      <div
                        key={f.id}
                        onClick={() => { openCocktail(f); setIsFavsOpen(false); }}
                        className="p-3 rounded-2xl bg-white/5 hover:bg-amber-500/10 border border-white/5 flex items-center justify-between cursor-pointer"
                      >
                        <div className="font-bold text-xs text-white">{f.name}</div>
                        <span className="text-amber-400 text-xs font-bold">➔</span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* 📜 MODALE CRONOLOGIA                                              */}
          {/* ================================================================= */}
          {isHistoryOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#12121c] border border-white/10 rounded-3xl p-5 shadow-2xl max-h-[80vh] flex flex-col">
                <div className="flex justify-between items-center pb-3 border-b border-white/10">
                  <h3 className="font-syne font-bold text-base text-white flex items-center gap-2">
                    <span>📜</span> Cronologia Consigli ({history.length})
                  </h3>
                  <button onClick={() => setIsHistoryOpen(false)} className="text-slate-400 hover:text-white text-base">✕</button>
                </div>
                <div className="overflow-y-auto no-scrollbar py-3 space-y-2 flex-1">
                  {history.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-8">Nessun consiglio recente.</p>
                  ) : (
                    history.map((h, i) => (
                      <div
                        key={i}
                        onClick={() => { openCocktail(h); setIsHistoryOpen(false); }}
                        className="p-3 rounded-2xl bg-white/5 hover:bg-amber-500/10 border border-white/5 flex items-center justify-between cursor-pointer"
                      >
                        <div className="font-bold text-xs text-white">{h.name}</div>
                        <span className="text-[10px] text-slate-400">{h.baseSpirit}</span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render UMD
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
