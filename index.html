<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Cocktail Lounge Advisor - Ricette, Cult Anni '80/'90 & Grandi Classici</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Syne & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Cocktails Database (90+ Ricette) -->
  <script src="cocktails-data.js"></script>

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #07070a;
      color: #f1f5f9;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, .font-syne { font-family: 'Syne', sans-serif; }

    /* Safe Area iOS */
    .ios-safe-layout {
      padding-top: max(calc(env(safe-area-inset-top, 0px) + 10px), 48px);
      padding-bottom: max(calc(env(safe-area-inset-bottom, 0px) + 16px), 24px);
      padding-left: max(env(safe-area-inset-left, 0px), 12px);
      padding-right: max(env(safe-area-inset-right, 0px), 12px);
    }

    .glass-card {
      background: linear-gradient(135deg, rgba(22, 22, 34, 0.88) 0%, rgba(12, 12, 19, 0.96) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-panel {
      background: rgba(16, 16, 25, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .gold-glow {
      box-shadow: 0 0 30px -5px rgba(245, 158, 11, 0.4);
    }

    .neon-blue-glow {
      box-shadow: 0 0 30px -5px rgba(6, 182, 212, 0.4);
    }

    @keyframes shaker-shake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-15deg) translateY(-8px) scale(1.05); }
      40% { transform: rotate(15deg) translateY(6px) scale(1.05); }
      60% { transform: rotate(-10deg) translateY(-4px); }
      80% { transform: rotate(10deg) translateY(3px); }
    }
    .animate-shaker { animation: shaker-shake 0.28s infinite ease-in-out; }

    /* Custom smooth scrollable styling */
    .custom-h-scroll {
      overflow-x: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(245, 158, 11, 0.3) rgba(255, 255, 255, 0.05);
    }
    .custom-h-scroll::-webkit-scrollbar {
      height: 4px;
    }
    .custom-h-scroll::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
    }
    .custom-h-scroll::-webkit-scrollbar-thumb {
      background: rgba(245, 158, 11, 0.35);
      border-radius: 4px;
    }
    .custom-h-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(245, 158, 11, 0.6);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#07070a] text-slate-100 antialiased selection:bg-amber-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // =========================================================================
    // 🍸 DATABASE MASTER (90+ Ricette d'Autore)
    // =========================================================================
    const COCKTAILS_DATABASE = (typeof window !== 'undefined' && window.COCKTAILS_DATABASE) ? window.COCKTAILS_DATABASE : [];

    // =========================================================================
    // 🔊 AUDIO ENGINE (Web Audio API nativo per feedback sonoro)
    // =========================================================================
    class SoundFx {
      constructor() { this.ctx = null; this.enabled = true; }
      init() {
        try {
          if (!this.ctx && typeof window !== 'undefined') {
            const C = window.AudioContext || window.webkitAudioContext;
            if (C) this.ctx = new C();
          }
          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        } catch (e) {}
      }
      tick() {
        if (!this.enabled) return;
        try {
          this.init(); if (!this.ctx) return;
          const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(440 + Math.random() * 200, this.ctx.currentTime);
          g.gain.setValueAtTime(0.04, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
          osc.connect(g); g.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.04);
        } catch (e) {}
      }
      chime() {
        if (!this.enabled) return;
        try {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.05);
            g.gain.setValueAtTime(0, now + i * 0.05);
            g.gain.linearRampToValueAtTime(0.12, now + i * 0.05 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.35);
            osc.connect(g); g.connect(this.ctx.destination);
            osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.35);
          });
        } catch (e) {}
      }
    }
    const sound = new SoundFx();

    const triggerHaptic = (ms = 20) => {
      try { if (typeof navigator !== 'undefined' && 'vibrate' in navigator) navigator.vibrate(ms); } catch (e) {}
    };

    // =========================================================================
    // 🧭 COMPONENTE RIGA CON SCORRIMENTO ORIZZONTALE & PULSANTI FRECCIA
    // =========================================================================
    function HorizontalScrollRow({ children, title, badge, actionText, onAction, subtitle }) {
      const scrollRef = useRef(null);

      const scroll = (direction) => {
        if (scrollRef.current) {
          const scrollAmount = direction === 'left' ? -220 : 220;
          scrollRef.current.scrollBy({ left: scrollAmount, behavior: 'smooth' });
        }
      };

      return (
        <div className="space-y-1.5 w-full">
          {(title || actionText) && (
            <div className="flex items-center justify-between px-0.5">
              <div className="flex items-center gap-1.5">
                {title && (
                  <span className="text-[11px] uppercase font-bold tracking-wider text-amber-400 font-syne flex items-center gap-1">
                    {title}
                  </span>
                )}
                {badge && (
                  <span className="text-[9px] px-1.5 py-0.2 rounded bg-amber-500/20 text-amber-300 font-semibold">
                    {badge}
                  </span>
                )}
              </div>
              <div className="flex items-center gap-1">
                {actionText && (
                  <button onClick={onAction} className="text-[10px] text-slate-400 hover:text-amber-300 font-medium mr-1">
                    {actionText}
                  </button>
                )}
                <button
                  onClick={() => scroll('left')}
                  className="w-5 h-5 rounded-full bg-white/5 hover:bg-white/15 text-slate-300 text-xs flex items-center justify-center border border-white/10 active:scale-90 transition"
                  title="Scorri a sinistra"
                >
                  ‹
                </button>
                <button
                  onClick={() => scroll('right')}
                  className="w-5 h-5 rounded-full bg-white/5 hover:bg-white/15 text-slate-300 text-xs flex items-center justify-center border border-white/10 active:scale-90 transition"
                  title="Scorri a destra"
                >
                  ›
                </button>
              </div>
            </div>
          )}
          {subtitle && (
            <p className="text-[10px] text-slate-400 px-0.5 -mt-1">{subtitle}</p>
          )}
          <div
            ref={scrollRef}
            className="flex gap-2 custom-h-scroll pb-1.5 pt-0.5 px-0.5 items-center w-full"
          >
            {children}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 📱 APP REACT COMPONENT
    // =========================================================================
    function App() {
      // Viste: 'cover' | 'advisor' | 'catalog' | 'detail'
      const [screen, setScreen] = useState('cover');
      
      // Filtri
      const [selectedSpirit, setSelectedSpirit] = useState('Tutti');
      const [selectedFlavor, setSelectedFlavor] = useState('Tutti');
      const [selectedStrength, setSelectedStrength] = useState('Tutti');
      const [searchQuery, setSearchQuery] = useState('');

      // Scheda attiva & Shuffler
      const [currentCocktail, setCurrentCocktail] = useState(null);
      const [isShuffling, setIsShuffling] = useState(false);
      const [shufflingName, setShufflingName] = useState('');
      const [servings, setServings] = useState(1);
      const [activeTab, setActiveTab] = useState('recipe'); // 'recipe' | 'tips' | 'story'

      // Swipe per scorrere a destra e sinistra tra i cocktail
      const [touchStartX, setTouchStartX] = useState(null);
      const [touchEndX, setTouchEndX] = useState(null);

      // Preferiti & Cronologia
      const [favorites, setFavorites] = useState(() => {
        try {
          const s = localStorage.getItem('cocktails_favs_v3');
          return s ? JSON.parse(s) : [];
        } catch (e) { return []; }
      });
      const [history, setHistory] = useState([]);
      const [isFavsOpen, setIsFavsOpen] = useState(false);
      const [isHistoryOpen, setIsHistoryOpen] = useState(false);
      const [isSoundOn, setIsSoundOn] = useState(true);
      const [copied, setCopied] = useState(false);

      useEffect(() => { sound.enabled = isSoundOn; }, [isSoundOn]);
      useEffect(() => {
        try { localStorage.setItem('cocktails_favs_v3', JSON.stringify(favorites)); } catch (e) {}
      }, [favorites]);

      // 🍸 LISTA COMPLETA DEI DISTILLATI & BASI
      const spiritList = [
        'Tutti',
        'Gin',
        'Vodka',
        'Rum',
        'Tequila / Mezcal',
        'Whiskey',
        'Campari',
        'Prosecco',
        'Cognac',
        'Liquori',
        'Zero Alcol'
      ];

      // 🍋 LISTA COMPLETA DI TUTTI I 20 GUSTI & PROFILI AROMATICI
      const flavorList = [
        'Tutti',
        'Fresco',
        'Agrumato',
        'Dolce',
        'Amaro',
        'Tropicale',
        'Erbaceo',
        'Speziato',
        'Frizzante',
        'Cremoso',
        'Secco',
        'Forte',
        'Caffè',
        'Fruttato',
        'Affumicato',
        'Sapido / Salino',
        'Vanigliato',
        'Balsamico / Menta',
        'Mandorlato',
        'Piccante',
        'Floreale'
      ];

      // ⚡ GRADAZIONI
      const strengthList = ['Tutti', 'Leggero', 'Medio', 'Forte', 'Analcolico'];

      // Helper di matching per Spirito
      const matchSpirit = useCallback((c, spirit) => {
        if (spirit === 'Tutti') return true;
        if (spirit === 'Zero Alcol') return c.baseSpirit === 'Zero Alcol' || c.strength.includes('Analcolico');
        if (spirit === 'Tequila / Mezcal') {
          return c.baseSpirit === 'Tequila' || c.baseSpirit === 'Mezcal' ||
            c.ingredients.some(i => i.name.toLowerCase().includes('tequila') || i.name.toLowerCase().includes('mezcal'));
        }
        if (spirit === 'Prosecco') {
          return c.baseSpirit === 'Prosecco' ||
            c.ingredients.some(i => i.name.toLowerCase().includes('prosecco') || i.name.toLowerCase().includes('champagne') || i.name.toLowerCase().includes('spumante'));
        }
        if (spirit === 'Cognac') {
          return c.baseSpirit === 'Cognac' ||
            c.ingredients.some(i => i.name.toLowerCase().includes('cognac') || i.name.toLowerCase().includes('brandy') || i.name.toLowerCase().includes('calvados') || i.name.toLowerCase().includes('pisco'));
        }
        if (spirit === 'Liquori') {
          return c.baseSpirit === 'Liquori' ||
            c.ingredients.some(i => i.name.toLowerCase().includes('amaretto') || i.name.toLowerCase().includes('midori') || i.name.toLowerCase().includes('baileys') || i.name.toLowerCase().includes('kahlúa') || i.name.toLowerCase().includes('cointreau') || i.name.toLowerCase().includes('limoncello') || i.name.toLowerCase().includes('sambuca') || i.name.toLowerCase().includes('galliano') || i.name.toLowerCase().includes('chartreuse') || i.name.toLowerCase().includes('st-germain') || i.name.toLowerCase().includes('menta'));
        }
        const sLow = spirit.toLowerCase();
        return c.baseSpirit.toLowerCase() === sLow || c.ingredients.some(i => i.name.toLowerCase().includes(sLow));
      }, []);

      // Helper di matching per Gusto
      const matchFlavor = useCallback((c, flavor) => {
        if (flavor === 'Tutti') return true;
        const fLow = flavor.toLowerCase();
        return c.flavors.some(f => {
          const cf = f.toLowerCase();
          if (cf === fLow) return true;
          if (fLow.includes('sapido') && (cf.includes('sapido') || cf.includes('salino'))) return true;
          if (fLow.includes('balsamico') && (cf.includes('balsamico') || cf.includes('menta'))) return true;
          if (fLow.includes('mandorlato') && (cf.includes('mandorlato') || cf.includes('noce'))) return true;
          if (fLow.includes('erbaceo') && (cf.includes('erbaceo') || cf.includes('botanico'))) return true;
          if (fLow.includes('affumicato') && (cf.includes('affumicato') || cf.includes('torbato'))) return true;
          return cf.includes(fLow) || fLow.includes(cf);
        });
      }, []);

      // Helper di matching per Gradazione
      const matchStrength = useCallback((c, strength) => {
        if (strength === 'Tutti') return true;
        if (strength === 'Analcolico') return c.strength.includes('Analcolico') || c.baseSpirit === 'Zero Alcol';
        return c.strength.toLowerCase().includes(strength.toLowerCase());
      }, []);

      // Calcolo dinamico conteggio cocktail per ciascun filtro
      const spiritCounts = useMemo(() => {
        const counts = {};
        spiritList.forEach(s => {
          counts[s] = COCKTAILS_DATABASE.filter(c => matchSpirit(c, s)).length;
        });
        return counts;
      }, [matchSpirit]);

      const flavorCounts = useMemo(() => {
        const counts = {};
        flavorList.forEach(f => {
          counts[f] = COCKTAILS_DATABASE.filter(c => matchFlavor(c, f)).length;
        });
        return counts;
      }, [matchFlavor]);

      // Filtro dinamico cocktail
      const filteredCocktails = useMemo(() => {
        return COCKTAILS_DATABASE.filter(c => {
          if (!matchSpirit(c, selectedSpirit)) return false;
          if (!matchFlavor(c, selectedFlavor)) return false;
          if (!matchStrength(c, selectedStrength)) return false;
          
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchName = c.name.toLowerCase().includes(q);
            const matchIng = c.ingredients.some(i => i.name.toLowerCase().includes(q));
            const matchCat = c.category.toLowerCase().includes(q);
            const matchFlav = c.flavors.some(f => f.toLowerCase().includes(q));
            const matchStory = c.story && c.story.toLowerCase().includes(q);
            const matchTips = c.tips && c.tips.toLowerCase().includes(q);
            if (!matchName && !matchIng && !matchCat && !matchFlav && !matchStory && !matchTips) return false;
          }
          return true;
        });
      }, [selectedSpirit, selectedFlavor, selectedStrength, searchQuery, matchSpirit, matchFlavor, matchStrength]);

      // Fallback suggeriti se filtri troppo stretti danno 0 risultati
      const fallbackSuggestions = useMemo(() => {
        if (filteredCocktails.length > 0) return [];
        // Se 0 risultati, suggeriamo cocktail che matchano almeno lo spirito o il gusto
        return COCKTAILS_DATABASE.filter(c => {
          if (selectedSpirit !== 'Tutti' && matchSpirit(c, selectedSpirit)) return true;
          if (selectedFlavor !== 'Tutti' && matchFlavor(c, selectedFlavor)) return true;
          return false;
        }).slice(0, 8);
      }, [filteredCocktails.length, selectedSpirit, selectedFlavor, matchSpirit, matchFlavor]);

      // Apri scheda cocktail
      const openCocktail = (cocktail) => {
        setCurrentCocktail(cocktail);
        setServings(1);
        setActiveTab('recipe');
        setScreen('detail');
        setHistory(prev => [cocktail, ...prev.filter(h => h.id !== cocktail.id)].slice(0, 25));
        triggerHaptic(15);
      };

      // Navigazione Successivo / Precedente nella Scheda Dettaglio (Scorrimento a destra/sinistra)
      const currentList = filteredCocktails.length > 0 ? filteredCocktails : COCKTAILS_DATABASE;
      const currentIndex = currentCocktail ? currentList.findIndex(c => c.id === currentCocktail.id) : -1;

      const goToNextCocktail = useCallback(() => {
        if (currentList.length === 0) return;
        let nextIdx = currentIndex + 1;
        if (nextIdx >= currentList.length) nextIdx = 0; // Loop circolare
        const next = currentList[nextIdx];
        if (next) {
          openCocktail(next);
          sound.tick();
        }
      }, [currentIndex, currentList]);

      const goToPrevCocktail = useCallback(() => {
        if (currentList.length === 0) return;
        let prevIdx = currentIndex - 1;
        if (prevIdx < 0) prevIdx = currentList.length - 1; // Loop circolare
        const prev = currentList[prevIdx];
        if (prev) {
          openCocktail(prev);
          sound.tick();
        }
      }, [currentIndex, currentList]);

      // Gestione Touch Swipe su mobile/tablet
      const handleTouchStart = (e) => {
        setTouchStartX(e.targetTouches[0].clientX);
      };
      const handleTouchMove = (e) => {
        setTouchEndX(e.targetTouches[0].clientX);
      };
      const handleTouchEnd = () => {
        if (touchStartX === null || touchEndX === null) return;
        const distance = touchStartX - touchEndX;
        const isLeftSwipe = distance > 50; // swipe verso sinistra -> prossimo
        const isRightSwipe = distance < -50; // swipe verso destra -> precedente
        if (isLeftSwipe) {
          goToNextCocktail();
        } else if (isRightSwipe) {
          goToPrevCocktail();
        }
        setTouchStartX(null);
        setTouchEndX(null);
      };

      // Randomizer / Sorprendimi
      const handleRandomize = (pool = filteredCocktails) => {
        const targetPool = pool.length > 0 ? pool : COCKTAILS_DATABASE;
        if (isShuffling) return;

        triggerHaptic([25, 35]);
        setIsShuffling(true);
        setScreen('detail');

        let winner = targetPool[Math.floor(Math.random() * targetPool.length)];
        if (targetPool.length > 1 && currentCocktail && winner.id === currentCocktail.id) {
          winner = targetPool.find(c => c.id !== currentCocktail.id) || winner;
        }

        let step = 0;
        const timer = setInterval(() => {
          const rand = COCKTAILS_DATABASE[Math.floor(Math.random() * COCKTAILS_DATABASE.length)];
          setShufflingName(rand.name);
          sound.tick();
          step++;
          if (step >= 14) {
            clearInterval(timer);
            setIsShuffling(false);
            setCurrentCocktail(winner);
            setServings(1);
            setActiveTab('recipe');
            setHistory(prev => [winner, ...prev.filter(h => h.id !== winner.id)].slice(0, 25));
            sound.chime();
            triggerHaptic([30, 40, 60]);
          }
        }, 50);
      };

      const toggleFav = (cocktail) => {
        setFavorites(prev => {
          const ex = prev.some(f => f.id === cocktail.id);
          if (ex) return prev.filter(f => f.id !== cocktail.id);
          triggerHaptic(25);
          return [cocktail, ...prev];
        });
      };

      const handleShare = async (c) => {
        const text = `🍸 *${c.name}* (${c.category})\n` +
          `"${c.description}"\n\n` +
          `📋 *Ingredienti (${servings}x porzioni):*\n` +
          c.ingredients.map(i => `• ${i.name}: ${i.amount * servings} ${i.unit}`).join('\n') +
          `\n\n💡 *Consiglio Barman:* ${c.tips}\n` +
          `\nScoprilo su Cocktail Lounge Advisor! 🚀`;

        if (typeof navigator !== 'undefined' && navigator.share) {
          try { await navigator.share({ title: c.name, text }); return; } catch (e) {}
        }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          }
        } catch (e) {}
      };

      const isFav = currentCocktail && favorites.some(f => f.id === currentCocktail.id);

      // Collezioni curate per la Copertina
      const cultDrinks = useMemo(() => COCKTAILS_DATABASE.filter(c => c.category.includes("Cult") || c.badge?.includes("90s") || c.badge?.includes("80s")), []);
      const aperitiviDrinks = useMemo(() => COCKTAILS_DATABASE.filter(c => c.category.includes("Aperitivo") || c.baseSpirit === 'Campari' || c.baseSpirit === 'Prosecco'), []);
      const tikiDrinks = useMemo(() => COCKTAILS_DATABASE.filter(c => c.flavors.includes('Tropicale') || c.category.includes('Tiki') || c.category.includes('Caraibico')), []);
      const mocktailDrinks = useMemo(() => COCKTAILS_DATABASE.filter(c => c.baseSpirit === 'Zero Alcol' || c.strength.includes('Analcolico')), []);
      const strongDrinks = useMemo(() => COCKTAILS_DATABASE.filter(c => c.strength.includes('Molto Forte') || c.strength.includes('High Proof') || c.badge?.includes('HIGH PROOF')), []);

      return (
        <div className="min-h-screen flex flex-col justify-between max-w-md mx-auto relative ios-safe-layout">

          {/* ================================================================= */}
          {/* 🎩 APP HEADER                                                     */}
          {/* ================================================================= */}
          <header className="flex items-center justify-between py-2 px-3 glass-panel rounded-2xl mb-2.5 border border-white/10 shadow-lg shrink-0">
            <div 
              onClick={() => setScreen('cover')} 
              className="flex items-center gap-2 cursor-pointer active:scale-95 transition"
            >
              <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-black font-extrabold shadow-md shadow-amber-500/20 text-sm">
                🍸
              </div>
              <div>
                <h1 className="text-xs font-extrabold font-syne tracking-tight text-white leading-none">
                  COCKTAIL <span className="text-amber-400">LOUNGE</span>
                </h1>
                <p className="text-[8px] uppercase tracking-widest text-slate-400 font-semibold mt-0.5">
                  {COCKTAILS_DATABASE.length}+ Ricette d'Autore
                </p>
              </div>
            </div>

            <div className="flex items-center gap-1.5">
              {/* Tasto Torna ai Filtri */}

                  🧊
                </div>
                <span className="text-[10px] font-bold uppercase tracking-widest text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20 mb-2">
                  Mixology Shaker
                </span>
                <h2 className="text-2xl font-extrabold font-syne text-white tracking-tight mb-1">
                  {shufflingName || 'Mixing...'}
                </h2>
                <p className="text-xs text-slate-400">Ricerca dell'equilibrio aromatico perfetto...</p>
              </div>
            )}

            {/* 5. SCHEDA DETTAGLIO COCKTAIL (CON SWIPE ORIZZONTALE & FRECCE DESTRA/SINISTRA) */}
            {screen === 'detail' && !isShuffling && currentCocktail && (
              <div 
                onTouchStart={handleTouchStart}
                onTouchMove={handleTouchMove}
                onTouchEnd={handleTouchEnd}
                className="w-full glass-card rounded-3xl p-4 sm:p-5 border border-amber-500/20 shadow-2xl relative space-y-3 max-h-[82vh] overflow-y-auto no-scrollbar select-none"
              >
                
                {/* BARRA SUPERIORE DI NAVIGAZIONE TRA DRINK (SCORRIMENTO DESTRA / SINISTRA) */}
                <div className="flex items-center justify-between pb-1 border-b border-white/10">
                  <button
                    onClick={goToPrevCocktail}
                    className="flex items-center gap-1 text-[11px] font-bold text-slate-300 hover:text-amber-400 bg-white/5 hover:bg-white/10 px-2 py-1 rounded-lg border border-white/10 active:scale-95 transition"
                    title="Cocktail Precedente (o scorri verso destra)"
                  >
                    ‹ Prec
                  </button>

                  <div className="text-center">
                    <span className="text-[9px] font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
                      {currentCocktail.category}
                    </span>
                    <div className="text-[8px] text-slate-400 mt-0.5">
                      {currentIndex >= 0 ? `${currentIndex + 1} di ${currentList.length} (Scorri ➔)` : 'Cocktail'}
                    </div>
                  </div>
                  
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={() => toggleFav(currentCocktail)}
                      className={`p-1.5 rounded-full border transition active:scale-90 text-xs ${isFav ? 'bg-rose-500/20 border-rose-500 text-rose-400' : 'bg-white/5 border-white/10 text-slate-300'}`}
                      title="Salva nei Preferiti"
                    >
                      {isFav ? '❤️' : '🤍'}
                    </button>

                    <button
                      onClick={() => handleShare(currentCocktail)}
                      className="p-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 active:scale-90 transition text-xs"
                      title="Condividi Ricetta"
                    >
                      {copied ? '✓' : '🔗'}
                    </button>

                    <button
                      onClick={goToNextCocktail}
                      className="flex items-center gap-1 text-[11px] font-bold text-amber-300 hover:text-amber-200 bg-amber-500/15 hover:bg-amber-500/25 px-2 py-1 rounded-lg border border-amber-500/30 active:scale-95 transition"
                      title="Cocktail Successivo (o scorri verso sinistra)"
                    >
                      Succ ›
                    </button>
                  </div>
                </div>

                {/* Titolo e Descrizione */}
                <div className="text-center pt-0.5">
                  <h2 className="text-2xl sm:text-3xl font-extrabold font-syne tracking-tight text-white mb-0.5">
                    {currentCocktail.name}
                  </h2>
                  <p className="text-xs text-slate-300 leading-relaxed italic max-w-sm mx-auto">
                    "{currentCocktail.description}"
                  </p>
                </div>

                {/* Tag Gusto & Dettagli Chiave */}
                <div className="flex flex-wrap justify-center gap-1.5">
                  <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/20">
                    🥃 Base: {currentCocktail.baseSpirit}
                  </span>
                  <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/20">
                    ⚡ {currentCocktail.strength}
                  </span>
                  {currentCocktail.flavors.map((f, i) => (
                    <span key={i} className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-white/5 text-slate-300 border border-white/5">
                      #{f}
                    </span>
                  ))}
                </div>

                {/* Selettore Dosi / Bicchieri */}
                <div className="flex items-center justify-between bg-black/40 px-3 py-1.5 rounded-xl border border-white/5 text-xs">
                  <span className="text-[11px] text-slate-400 font-medium">Numero di Bicchieri:</span>
                  <div className="flex items-center gap-1.5">
                    {[1, 2, 4].map(num => (
                      <button
                        key={num}
                        onClick={() => setServings(num)}
                        className={`px-2.5 py-0.5 rounded-lg font-bold text-xs transition active:scale-95 ${servings === num ? 'bg-amber-500 text-black shadow-md' : 'bg-white/5 text-slate-400 hover:text-white'}`}
                      >
                        {num}x
                      </button>
                    ))}
                  </div>
                </div>

                {/* Tabs di navigazione della Scheda */}
                <div className="grid grid-cols-3 gap-1 bg-black/50 p-1 rounded-xl border border-white/10 text-xs">
                  {[
                    { id: 'recipe', label: '📋 Ricetta' },
                    { id: 'tips', label: '⭐ Barman' },
                    { id: 'story', label: '📖 Storia' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`py-1.5 rounded-lg font-semibold transition text-center ${activeTab === tab.id ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'text-slate-400 hover:text-white'}`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                {/* TAB 1: RICETTA & INGREDIENTI */}
                {activeTab === 'recipe' && (
                  <div className="space-y-2.5">
                    <div className="bg-black/30 rounded-2xl p-3 border border-white/5">
                      <div className="text-[10px] font-bold uppercase tracking-wider text-amber-400 font-syne mb-1.5 flex justify-between">
                        <span>Ingredienti ({servings} {servings === 1 ? 'bicchiere' : 'bicchieri'})</span>
                        <span className="text-[9px] text-slate-400 font-sans">Dosi precise</span>
                      </div>
                      <div className="space-y-1.5">
                        {currentCocktail.ingredients.map((ing, idx) => (
                          <div key={idx} className="flex items-center justify-between text-xs py-1 border-b border-white/5 last:border-0">
                            <span className="text-slate-200 font-medium">• {ing.name}</span>
                            <span className="font-bold text-amber-300 bg-amber-500/10 px-2 py-0.5 rounded-md">
                              {ing.amount * servings} {ing.unit}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-black/30 rounded-2xl p-3 border border-white/5">
                      <div className="text-[10px] font-bold uppercase tracking-wider text-amber-400 font-syne mb-1.5">
                        Preparazione Passo-Passo
                      </div>
                      <div className="space-y-1.5">
                        {currentCocktail.recipe.map((step, idx) => (
                          <div key={idx} className="flex items-start gap-2 text-xs text-slate-300">
                            <span className="w-4 h-4 rounded-full bg-amber-500/20 text-amber-400 font-bold text-[10px] flex items-center justify-center shrink-0 mt-0.5">
                              {idx + 1}
                            </span>
                            <span className="leading-relaxed">{step}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* TAB 2: CONSIGLI DEL BARMAN */}
                {activeTab === 'tips' && (
                  <div className="space-y-2 text-xs">
                    <div className="bg-black/30 rounded-2xl p-3 border border-white/5">
                      <div className="text-amber-400 font-bold mb-1 flex items-center gap-1.5">
                        <span>🍸</span> Bicchiere di Servizio
                      </div>
                      <p className="text-slate-200">{currentCocktail.glass}</p>
                    </div>

                    <div className="bg-gradient-to-r from-amber-500/15 to-transparent rounded-2xl p-3 border border-amber-500/30">
                      <div className="text-amber-400 font-bold font-syne mb-1 flex items-center gap-1.5">
                        <span>⭐</span> Il Segreto del Bartender
                      </div>
                      <p className="text-slate-200 leading-relaxed">{currentCocktail.tips}</p>
                    </div>
                  </div>
                )}

                {/* TAB 3: STORIA & ORIGINE */}
                {activeTab === 'story' && (
                  <div className="bg-black/30 rounded-2xl p-3.5 border border-white/5 text-xs">
                    <div className="text-amber-400 font-bold font-syne mb-1.5 flex items-center gap-1.5">
                      <span>📖</span> Storia & Aneddoti del Drink
                    </div>
                    <p className="text-slate-300 leading-relaxed italic">{currentCocktail.story}</p>
                  </div>
                )}

                {/* CAROSELLO SCORREVOLE ORIZZONTALE IN BASSO: ALTRI COCKTAIL SUGGERITI */}
                <div className="pt-2 border-t border-white/10">
                  <HorizontalScrollRow
                    title="🍹 Altri Drink Simili"
                    subtitle="Scorri verso destra per sfogliare altri cocktail correlati ➔"
                  >
                    {currentList.filter(c => c.id !== currentCocktail.id).slice(0, 10).map(item => (
                      <div
                        key={item.id}
                        onClick={() => openCocktail(item)}
                        className="shrink-0 w-32 p-2 rounded-xl bg-black/40 hover:bg-amber-500/15 border border-white/10 hover:border-amber-500/30 cursor-pointer active:scale-95 text-xs transition"
                      >
                        <div className="font-bold text-white line-clamp-1">{item.name}</div>
                        <div className="text-[9px] text-amber-300 mt-0.5">{item.baseSpirit}</div>
                      </div>
                    ))}
                  </HorizontalScrollRow>
                </div>

              </div>
            )}

          </main>

          {/* ================================================================= */}
          {/* 🔘 FOOTER BUTTONS                                                 */}
          {/* ================================================================= */}
          <footer className="pt-2.5 space-y-2 shrink-0">
            {screen === 'detail' && !isShuffling && (
              <div className="grid grid-cols-2 gap-2">
                <button
                  onClick={() => handleRandomize(filteredCocktails)}
                  className="py-2.5 px-3 rounded-2xl font-bold font-syne text-xs uppercase tracking-wider bg-white/10 hover:bg-white/15 text-white border border-white/10 active:scale-95 transition flex items-center justify-center gap-1.5"
                >
                  <span>🔄</span>
                  <span>Altro con questi filtri</span>
                </button>

                <button
                  onClick={() => handleRandomize(COCKTAILS_DATABASE)}
                  className="py-2.5 px-3 rounded-2xl font-bold font-syne text-xs uppercase tracking-wider bg-gradient-to-r from-amber-500 to-amber-600 text-black border border-amber-300 gold-glow active:scale-95 transition flex items-center justify-center gap-1.5 shadow-xl"
                >
                  <span>🎲</span>
                  <span>A Sorpresa</span>
                </button>
              </div>
            )}

            {screen === 'advisor' && (
              <div className="grid grid-cols-2 gap-2">
                <button
                  onClick={() => handleRandomize(COCKTAILS_DATABASE)}
                  className="py-2.5 px-3 rounded-2xl font-bold font-syne text-xs uppercase tracking-wider bg-white/10 text-white border border-white/10 active:scale-95 flex items-center justify-center gap-1.5"
                >
                  <span>🎲</span>
                  <span>A Sorpresa</span>
                </button>

                <button
                  onClick={() => setScreen('catalog')}
                  className="py-2.5 px-3 rounded-2xl font-bold font-syne text-xs uppercase tracking-wider bg-white/10 text-white border border-white/10 active:scale-95 flex items-center justify-center gap-1.5"
                >
                  <span>📖</span>
                  <span>Tutto il Catalogo</span>
                </button>
              </div>
            )}
          </footer>

          {/* ================================================================= */}
          {/* 💖 MODALE PREFERITI                                               */}
          {/* ================================================================= */}
          {isFavsOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#12121c] border border-white/10 rounded-3xl p-5 shadow-2xl max-h-[80vh] flex flex-col">
                <div className="flex justify-between items-center pb-3 border-b border-white/10">
                  <h3 className="font-syne font-bold text-base text-white flex items-center gap-2">
                    <span>❤️</span> I Tuoi Preferiti ({favorites.length})
                  </h3>
                  <button onClick={() => setIsFavsOpen(false)} className="text-slate-400 hover:text-white text-base">✕</button>
                </div>
                <div className="overflow-y-auto no-scrollbar py-3 space-y-2 flex-1">
                  {favorites.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-8">Nessun cocktail salvato. Tocca il cuore ❤️ su una scheda per salvarlo qui.</p>
                  ) : (
                    favorites.map(f => (
                      <div
                        key={f.id}
                        onClick={() => { openCocktail(f); setIsFavsOpen(false); }}
                        className="p-3 rounded-2xl bg-white/5 hover:bg-amber-500/10 border border-white/5 flex items-center justify-between cursor-pointer"
                      >
                        <div className="font-bold text-xs text-white">{f.name}</div>
                        <span className="text-amber-400 text-xs font-bold">➔</span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* 📜 MODALE CRONOLOGIA                                              */}
          {/* ================================================================= */}
          {isHistoryOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#12121c] border border-white/10 rounded-3xl p-5 shadow-2xl max-h-[80vh] flex flex-col">
                <div className="flex justify-between items-center pb-3 border-b border-white/10">
                  <h3 className="font-syne font-bold text-base text-white flex items-center gap-2">
                    <span>📜</span> Cronologia Consigli ({history.length})
                  </h3>
                  <button onClick={() => setIsHistoryOpen(false)} className="text-slate-400 hover:text-white text-base">✕</button>
                </div>
                <div className="overflow-y-auto no-scrollbar py-3 space-y-2 flex-1">
                  {history.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-8">Nessun consiglio recente.</p>
                  ) : (
                    history.map((h, i) => (
                      <div
                        key={i}
                        onClick={() => { openCocktail(h); setIsHistoryOpen(false); }}
                        className="p-3 rounded-2xl bg-white/5 hover:bg-amber-500/10 border border-white/5 flex items-center justify-between cursor-pointer"
                      >
                        <div className="font-bold text-xs text-white">{h.name}</div>
                        <span className="text-[10px] text-slate-400">{h.baseSpirit}</span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render UMD
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
