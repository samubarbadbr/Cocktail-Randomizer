        id: 'shirley-temple',
        name: 'Shirley Temple',
        category: 'Mocktail',
        description: 'Il mocktail classico più famoso. Ginger Ale dolce, granatina rubino e un tocco di limone.',
        flavor: ['Dolce', 'Fruttato', 'Frizzante'],
        ingredients: [
          { name: 'Ginger Ale', amount: '120 ml' },
          { name: 'Sciroppo di Granatina', amount: '15 ml' },
          { name: 'Succo di limone', amount: '5 ml' }
        ],
        story: 'Creato negli anni ’30 al bar Chasen\'s di Beverly Hills per la celebre attrice bambina Shirley Temple.',
        glass: 'Highball',
        garnish: 'Ciliegina al maraschino',
        abv: 'Analcolico',
        colorAccent: 'rose'
      }
    ];

    // --- AUDIO SYNTHESIZER ---
    class SoundFx {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        try {
          if (!this.ctx && typeof window !== 'undefined') {
            const CtxClass = window.AudioContext || window.webkitAudioContext;
            if (CtxClass) this.ctx = new CtxClass();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        } catch (e) {}
      }

      playTick() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400 + Math.random() * 200, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.03);
        } catch (e) {}
      }

      playChime() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.05);
            gain.gain.setValueAtTime(0, now + i * 0.05);
            gain.gain.linearRampToValueAtTime(0.1, now + i * 0.05 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.3);
          });
        } catch (e) {}
      }
    }

    const sound = new SoundFx();

    const triggerHaptic = (pattern = 25) => {
      try {
        if (typeof navigator !== 'undefined' && 'vibrate' in navigator) {
          navigator.vibrate(pattern);
        }
      } catch (e) {}
    };

    // --- SVG ICONS COMPONENTS ---
    function GlassIcon({ type, className = "w-5 h-5" }) {
      return (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          {type === 'Coupe' ? (
            <g><path d="M6 3h12a6 6 0 0 1-6 6 6 6 0 0 1-6-6Z" fill="currentColor" fillOpacity="0.15" /><path d="M12 9v9" /><path d="M8 21h8" /><path d="M4 3h16" /></g>
          ) : type === 'Old Fashioned' ? (
            <g><path d="M5 5h14v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5Z" fill="currentColor" fillOpacity="0.15" /><path d="M5 8h14" /></g>
          ) : type === 'Copper Mug' ? (
            <g><rect x="5" y="5" width="12" height="15" rx="2" fill="currentColor" fillOpacity="0.15" /><path d="M17 8h2a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2" /></g>
          ) : (
            <g><path d="M6 3h12v17a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V3Z" fill="currentColor" fillOpacity="0.15" /><path d="M6 7h12" /></g>
          )}
        </svg>
      );
    }

    // --- MAIN REACT APPLICATION ---
    function App() {
      const [currentCocktail, setCurrentCocktail] = useState(null);
      const [isShuffling, setIsShuffling] = useState(false);
      const [shuffleName, setShuffleName] = useState('Paper Plane');
      const [history, setHistory] = useState([]);
      const [favorites, setFavorites] = useState(() => {
        try {
          const saved = localStorage.getItem('cocktail_randomizer_favs');
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });

      const [activeFilter, setActiveFilter] = useState('all');
      const [isAudioEnabled, setIsAudioEnabled] = useState(true);
      const [isHistoryOpen, setIsHistoryOpen] = useState(false);
      const [isFavoritesOpen, setIsFavoritesOpen] = useState(false);
      const [showStory, setShowStory] = useState(false);
      const [copied, setCopied] = useState(false);
      const [lastId, setLastId] = useState(null);

      useEffect(() => {
        sound.enabled = isAudioEnabled;
      }, [isAudioEnabled]);

      useEffect(() => {
        try {
          localStorage.setItem('cocktail_randomizer_favs', JSON.stringify(favorites));
        } catch (e) {}
      }, [favorites]);

      // Filtered cocktail pool
      const filteredPool = useMemo(() => {
        return COCKTAILS_DATABASE.filter(item => {
          if (activeFilter === 'all') return true;
          if (activeFilter === 'amaro') return item.flavor.some(f => f.includes('Amaro') || f.includes('Erbaceo'));
          if (activeFilter === 'agrumato') return item.flavor.some(f => f.includes('Agrumato') || f.includes('Fresco'));
          if (activeFilter === 'forte') return item.abv === 'Elevato' || item.abv === 'Molto Elevato';
          if (activeFilter === 'mocktail') return item.category === 'Mocktail' || item.abv === 'Analcolico';
          return true;
        });
      }, [activeFilter]);

      // Randomize function
      const handleGenerate = useCallback(() => {
        if (filteredPool.length === 0 || isShuffling) return;

        triggerHaptic([15, 20]);
        setIsShuffling(true);
        setShowStory(false);

        // Anti-repetition rule
        let pool = filteredPool;
        if (pool.length > 1 && lastId) {
          pool = pool.filter(c => c.id !== lastId);
        }

        const winner = pool[Math.floor(Math.random() * pool.length)];

        // Shuffle sound & text effect
        let count = 0;
        const interval = setInterval(() => {
          const rand = COCKTAILS_DATABASE[Math.floor(Math.random() * COCKTAILS_DATABASE.length)];
          setShuffleName(rand.name);
          sound.playTick();
          count++;
          if (count >= 14) {
            clearInterval(interval);
            setCurrentCocktail(winner);
            setLastId(winner.id);
            setHistory(prev => [winner, ...prev.filter(h => h.id !== winner.id)].slice(0, 20));
            setIsShuffling(false);
            sound.playChime();
            triggerHaptic([30, 40, 50]);
          }
        }, 50);

      }, [filteredPool, isShuffling, lastId]);

      // Favorite toggle
      const handleToggleFavorite = (item) => {
        setFavorites(prev => {
          const exists = prev.some(f => f.id === item.id);
          if (exists) return prev.filter(f => f.id !== item.id);
          triggerHaptic(20);
          return [item, ...prev];
        });
      };

      // Share cocktail
      const handleShare = async (item) => {
        const text = `🍹 *${item.name}* (${item.category})\n` +
          `"Cosa beviamo stasera? ${item.name}!"\n\n` +
          `🍸 *Bicchiere:* ${item.glass}\n` +
          `🍋 *Garnish:* ${item.garnish}\n\n` +
          `📋 *Ingredienti:*\n` +
          item.ingredients.map(i => `• ${i.name}: ${i.amount}`).join('\n') +
          `\n\nGenerato con Cocktail Randomizer! 🚀`;

        if (typeof navigator !== 'undefined' && navigator.share) {
          try {
            await navigator.share({ title: item.name, text });
            return;
          } catch (e) {}
        }

        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            setCopied(true);
            setTimeout(() => setCopied(false), 2500);
          }
        } catch (e) {}
      };

      const isFav = currentCocktail && favorites.some(f => f.id === currentCocktail.id);

      return (
        <div className="min-h-screen min-h-[100dvh] flex flex-col justify-between max-w-md mx-auto relative px-3 sm:px-4 ios-safe-container">
          
          {/* HEADER */}
          <header className="flex items-center justify-between py-2.5 px-3.5 glass-panel rounded-2xl mb-3 border border-white/10">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-black font-extrabold shadow-lg shadow-amber-500/20">
                ✨
              </div>
              <div>
                <h1 className="text-base font-bold font-syne tracking-tight text-white leading-none">
                  COCKTAIL <span className="text-amber-400">RANDOMIZER</span>
                </h1>
                <p className="text-[10px] uppercase tracking-widest text-slate-400">Cosa beviamo stasera?</p>
              </div>
            </div>

            <div className="flex items-center gap-1.5">
              {/* Audio Toggle */}
              <button
                onClick={() => setIsAudioEnabled(!isAudioEnabled)}
                className="p-2 rounded-full bg-white/5 hover:bg-white/10 text-slate-300 border border-white/5 active:scale-95 transition"
                title={isAudioEnabled ? "Audio On" : "Audio Mute"}
              >
                {isAudioEnabled ? "🔊" : "🔇"}
              </button>

              {/* Favorites Button */}
              <button
                onClick={() => setIsFavoritesOpen(true)}
                className="relative p-2 rounded-full bg-white/5 hover:bg-white/10 text-slate-300 border border-white/5 active:scale-95 transition"
                title="Preferiti"
              >
                ❤️
                {favorites.length > 0 && (
                  <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
                    {favorites.length}
                  </span>
                )}
              </button>

              {/* History Button */}
              <button
                onClick={() => setIsHistoryOpen(true)}
                className="relative p-2 rounded-full bg-white/5 hover:bg-white/10 text-slate-300 border border-white/5 active:scale-95 transition"
                title="Cronologia"
              >
                📜
                {history.length > 0 && (
                  <span className="absolute -top-1 -right-1 bg-amber-500 text-black text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
                    {history.length}
                  </span>
                )}
              </button>
            </div>
          </header>

          {/* CATEGORY FILTERS */}
          <div className="flex items-center gap-2 overflow-x-auto no-scrollbar pb-3 text-xs">
            {[
              { id: 'all', label: 'Tutti i drink' },
              { id: 'amaro', label: 'Amari & Erbe' },
              { id: 'agrumato', label: 'Agrumati & Freschi' },
              { id: 'forte', label: 'Secchi & Forti' },
              { id: 'mocktail', label: 'Analcolici' }
            ].map(f => (
              <button
                key={f.id}
                onClick={() => setActiveFilter(f.id)}
                className={`px-3 py-1.5 rounded-full whitespace-nowrap font-medium transition border ${
                  activeFilter === f.id
                    ? 'bg-amber-500/20 text-amber-300 border-amber-500/50 shadow-sm'
                    : 'bg-white/5 text-slate-400 border-white/5 hover:bg-white/10'
                }`}
              >
                {f.label}
              </button>
            ))}
          </div>

          {/* MAIN DISPLAY AREA */}
          <div className="flex-1 flex flex-col justify-center items-center my-3">
            {isShuffling ? (
              <div className="w-full glass-card p-8 rounded-3xl text-center border border-amber-500/30 flex flex-col items-center justify-center min-h-[220px]">
                <div className="w-12 h-12 rounded-full bg-amber-500/20 flex items-center justify-center border border-amber-500/40 animate-spin text-xl mb-3">
                  🎲
                </div>
                <h2 className="text-2xl font-extrabold font-syne text-white tracking-tight shuffle-blur mb-1">
                  {shuffleName}
                </h2>
                <p className="text-xs text-amber-400 font-medium">Mescolando gli ingredienti...</p>
              </div>
            ) : currentCocktail ? (
              /* COCKTAIL CARD RESULT */
              <div className="w-full glass-card rounded-3xl p-6 border border-amber-500/20 shadow-2xl relative overflow-hidden">
                {/* Header info */}
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30">
                      {currentCocktail.category}
                    </span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-white/5 border border-white/10 text-slate-300">
                      ABV {currentCocktail.abv}
                    </span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={() => handleToggleFavorite(currentCocktail)}
                      className="p-2 rounded-full bg-white/5 border border-white/10 active:scale-90 transition text-sm"
                    >
                      {isFav ? '❤️' : '🤍'}
                    </button>
                    <button
                      onClick={() => handleShare(currentCocktail)}
                      className="p-2 rounded-full bg-white/5 border border-white/10 active:scale-90 transition text-sm"
                    >
                      {copied ? '✅' : '🔗'}
                    </button>
                  </div>
                </div>

                {/* Cocktail Title */}
                <div className="text-center my-3">
                  <h2 className="text-3xl font-extrabold font-syne tracking-tight text-white mb-2">
                    {currentCocktail.name}
                  </h2>
                  <p className="text-xs text-slate-300 leading-relaxed max-w-xs mx-auto">
                    {currentCocktail.description}
                  </p>
                </div>

                {/* Flavor tags */}
                <div className="flex flex-wrap justify-center gap-1.5 my-3">
                  {currentCocktail.flavor.map((f, i) => (
                    <span key={i} className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/20">
                      {f}
                    </span>
                  ))}
                </div>

                {/* Ingredients list */}
                <div className="bg-black/40 rounded-2xl p-4 border border-white/10 my-4">
                  <div className="text-xs font-bold uppercase tracking-wider text-amber-400 font-syne mb-2.5 border-b border-white/10 pb-1.5 flex justify-between">
                    <span>Ingredienti</span>
                    <span className="text-[10px] text-slate-400 font-sans font-normal">Dosi per 1 drink</span>
                  </div>
                  <ul className="space-y-1.5 text-xs">
                    {currentCocktail.ingredients.map((ing, idx) => (
                      <li key={idx} className="flex justify-between items-center py-0.5 border-b border-white/5 last:border-0">
                        <span className="text-slate-100">{ing.name}</span>
                        <span className="font-bold text-amber-300 font-mono text-[11px] bg-amber-500/10 px-1.5 py-0.5 rounded border border-amber-500/20">
                          {ing.amount}
                        </span>
                      </li>
                    ))}
                  </ul>
                </div>

                {/* Glassware & Garnish */}
                <div className="grid grid-cols-2 gap-2.5 mb-4">
                  <div className="bg-white/5 rounded-2xl p-2.5 border border-white/5 flex items-center gap-2 min-w-0">
                    <GlassIcon type={currentCocktail.glass} className="w-5 h-5 text-amber-400 shrink-0" />
                    <div className="min-w-0 flex-1">
                      <span className="block text-[9px] uppercase tracking-wider text-slate-400">Bicchiere</span>
                      <span className="text-xs font-semibold text-slate-200 block truncate">{currentCocktail.glass}</span>
                    </div>
                  </div>

                  <div className="bg-white/5 rounded-2xl p-2.5 border border-white/5 flex items-center gap-2 min-w-0">
                    <span className="text-base shrink-0">🍋</span>
                    <div className="min-w-0 flex-1">
                      <span className="block text-[9px] uppercase tracking-wider text-slate-400">Garnish</span>
                      <span className="text-xs font-semibold text-slate-200 block leading-tight break-words" title={currentCocktail.garnish}>
                        {currentCocktail.garnish}
                      </span>
                    </div>
                  </div>
                </div>

                {/* Story accordion */}
                <div className="border border-white/10 rounded-2xl bg-white/5 overflow-hidden">
                  <button
                    onClick={() => setShowStory(!showStory)}
                    className="w-full px-4 py-2.5 text-xs font-semibold text-slate-300 flex items-center justify-between"
                  >
                    <span>📖 Curiosità & Storia</span>
                    <span className="text-amber-400 font-bold">{showStory ? '▲' : '▼'}</span>
                  </button>
                  {showStory && (
                    <div className="px-4 pb-3 text-xs text-slate-300 border-t border-white/5 bg-black/20 pt-2 leading-relaxed">
                      {currentCocktail.story}
                    </div>
                  )}
                </div>
              </div>
            ) : (
              /* HERO INTRO SCREEN */
              <div className="text-center py-8 px-4 flex flex-col items-center my-auto">
                <div className="w-20 h-20 rounded-3xl bg-gradient-to-b from-amber-500/20 to-black/60 border border-amber-500/30 flex items-center justify-center text-3xl mb-4 shadow-2xl backdrop-blur-md">
                  🍸
                </div>
                <span className="text-xs font-bold uppercase tracking-widest text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20 mb-3">
                  Nightlife Randomizer
                </span>
                <h2 className="text-3xl font-extrabold font-syne text-white tracking-tight mb-2">
                  Cosa beviamo stasera?
                </h2>
                <p className="text-xs text-slate-300 leading-relaxed max-w-xs mb-6">
                  Premi il pulsante oro qui sotto e lascia decidere al caso il cocktail perfetto per te e i tuoi amici!
                </p>
                <div className="grid grid-cols-3 gap-2 w-full max-w-xs bg-white/5 p-3 rounded-2xl border border-white/5 text-center text-xs">
                  <div>
                    <span className="block font-bold text-amber-400">{COCKTAILS_DATABASE.length}</span>
                    <span className="text-[10px] text-slate-400">Cocktail</span>
                  </div>
                  <div>
                    <span className="block font-bold text-amber-400">100%</span>
                    <span className="text-[10px] text-slate-400">Casuale</span>
                  </div>
                  <div>
                    <span className="block font-bold text-amber-400">Instant</span>
                    <span className="text-[10px] text-slate-400">Offline</span>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* PRIMARY RANDOMIZER CTA BUTTON */}
          <div className="pt-2">
            <button
              onClick={handleGenerate}
              disabled={isShuffling}
              className={`w-full py-4 px-6 rounded-2xl font-bold font-syne text-lg tracking-wide uppercase transition-all duration-300 flex items-center justify-center gap-2 border shadow-2xl ${
                isShuffling
                  ? 'bg-amber-600 text-black border-amber-400 animate-pulse'
                  : 'bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 text-black border-amber-300 amber-glow active:scale-95 hover:brightness-110'
              }`}
            >
              <span className="text-xl">🎲</span>
              <span>{isShuffling ? 'ESTRAZIONE...' : currentCocktail ? 'GENERA UN ALTRO COCKTAIL' : 'COSA BEVIAMO STASERA?'}</span>
            </button>
          </div>

          {/* HISTORY DRAWER MODAL */}
          {isHistoryOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex justify-end">
              <div className="w-full max-w-xs h-full bg-[#121218] border-l border-white/10 p-5 flex flex-col justify-between overflow-y-auto">
                <div>
                  <div className="flex justify-between items-center pb-3 border-b border-white/10 mb-4">
                    <h3 className="font-bold font-syne text-white text-base">📜 Cronologia Sessione</h3>
                    <button onClick={() => setIsHistoryOpen(false)} className="text-slate-400 text-lg">✕</button>
                  </div>
                  {history.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-8">Nessun cocktail estratto finora.</p>
                  ) : (
                    <div className="space-y-2">
                      {history.map((item, idx) => (
                        <div
                          key={idx}
                          onClick={() => { setCurrentCocktail(item); setIsHistoryOpen(false); }}
                          className="p-2.5 rounded-xl bg-white/5 hover:bg-amber-500/10 border border-white/5 cursor-pointer flex justify-between items-center text-xs"
                        >
                          <div>
                            <span className="font-bold text-white block">{item.name}</span>
                            <span className="text-[10px] text-slate-400">{item.category}</span>
                          </div>
                          <span className="text-amber-400 text-xs">➔</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                {history.length > 0 && (
                  <button onClick={() => setHistory([])} className="w-full py-2 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 text-xs font-bold mt-4">
                    Svuota cronologia
                  </button>
                )}
              </div>
            </div>
          )}

          {/* FAVORITES MODAL */}
          {isFavoritesOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-xs max-h-[80vh] bg-[#121218] border border-white/10 rounded-3xl p-5 flex flex-col justify-between overflow-y-auto shadow-2xl">
                <div>
                  <div className="flex justify-between items-center pb-3 border-b border-white/10 mb-4">
                    <h3 className="font-bold font-syne text-white text-base">❤️ Preferiti ({favorites.length})</h3>
                    <button onClick={() => setIsFavoritesOpen(false)} className="text-slate-400 text-lg">✕</button>
                  </div>
                  {favorites.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-8">Nessun preferito salvato.</p>
                  ) : (
                    <div className="space-y-2">
                      {favorites.map(item => (
                        <div
                          key={item.id}
                          onClick={() => { setCurrentCocktail(item); setIsFavoritesOpen(false); }}
                          className="p-2.5 rounded-xl bg-white/5 hover:bg-rose-500/10 border border-white/5 cursor-pointer flex justify-between items-center text-xs"
                        >
                          <div>
                            <span className="font-bold text-white block">{item.name}</span>
                            <span className="text-[10px] text-slate-400">{item.category}</span>
                          </div>
                          <span className="text-rose-400 text-xs">➔</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <button onClick={() => setIsFavoritesOpen(false)} className="w-full py-2 rounded-xl bg-white/5 text-slate-300 text-xs font-semibold mt-4">
                  Chiudi
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App
    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    }
  </script>
</body>
</html>
